<style>

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;

  }

    position: fixed;
    inset: 0;
    height: 100dvh; /* stabil walau address bar HP muncul/hilang, beda dgn 100vh */

    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #ffffff;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
  }
</style>
</head>
<body>

<div id="app">
  <iframe
    id="mlFrame"
